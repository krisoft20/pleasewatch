[package]
name = "pleasewatch"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Self-hosted media library backend"
license = "AGPL-3.0-only"
repository = "https://github.com/krisoft20/pleasewatch"
homepage = "https://github.com/krisoft20/pleasewatch"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
argon2 = "0.5"
time = "0.3"
reqwest = { version = "0.12", features = ["json", "multipart", "cookies", "rustls-tls", "stream", "gzip"] }
bytes = "1"
tokio-util = { version = "0.7", features = ["io"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
codegen-units = 16
lto = "thin"
debug = 0
strip = "symbols"
